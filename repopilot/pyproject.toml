[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "CLI tool that scans repos, detects dependency files, and runs the right install commands."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "RepoPilot Team"}
]

[project.scripts]
repopilot = "repopilot.main:main"

[tool.setuptools.packages.find]
include = ["repopilot*"]
